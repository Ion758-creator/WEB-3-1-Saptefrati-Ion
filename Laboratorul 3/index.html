<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piatra, Hârtia, Foarfeca</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Piatra, Hârtia, Foarfeca</h1>

        <p>Alege una dintre variante:</p>

        <div class="buttons">
            <button id="rock">Piatra</button>
            <button id="paper">Hârtia</button>
            <button id="scissors">Foarfeca</button>
        </div>

        <div class="result">
            <p><strong>Alegerea ta:</strong> <span id="playerChoice">-</span></p>
            <p><strong>Alegerea calculatorului:</strong> <span id="computerChoice">-</span></p>

            <h2 id="resultText">Așteaptă rezultatul...</h2>

            <p><strong>Scor:</strong></p>
            <p>
                Tu: <span id="playerScore">0</span> |
                Calculator: <span id="computerScore">0</span> |
                Egalități: <span id="draws">0</span>
            </p>

            <p><strong>Runde jucate:</strong> <span id="rounds">0</span></p>

            <p id="leader">Scorul este egal.</p>

            <button id="newGame">Joc nou</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
